name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make test
      - run: make dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Slide.dmg
          path: build/Slide.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Slide.dmg
      # Attach to the release if one already exists for the tag (say, a published draft); otherwise create it.
      - run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Slide.dmg --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" Slide.dmg --repo "$GITHUB_REPOSITORY" --title "Slide ${GITHUB_REF_NAME#v}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
