name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make test
      - run: make dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Slide.dmg
          path: build/Slide.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Slide.dmg
      - run: gh release create "$GITHUB_REF_NAME" Slide.dmg --repo "$GITHUB_REPOSITORY" --title "Slide ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
